<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSI Shared Tool</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">NANOHOME · SHARED DATA</p><h1>PSI Control Room</h1></div><div id="identity" hidden><span id="who"></span><button id="logout">Đăng xuất</button></div></header>
<section id="login" class="panel login"><h2>Đăng nhập</h2><label>User ID<input id="user-id" autocomplete="username" placeholder="purchase"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login-button">Vào dashboard</button><p id="login-error" class="error"></p></section>
<section id="app" hidden><div class="toolbar panel"><label>Tuần báo cáo<input id="week" type="week"></label><button id="refresh">Refresh</button><span id="run-status"></span><a id="download" hidden>Download PSI Final</a><button id="generate" hidden>Regenerate (Tech)</button></div>
<section class="panel"><h2>Nguồn dữ liệu <small id="progress"></small></h2><div id="sources" class="sources"></div></section>
<section class="panel"><div class="row"><h2>Mismatch</h2><label><input id="new-only" type="checkbox"> Chỉ case mới</label><input id="search" placeholder="Tìm theo mã raw/SKU"></div><div class="table-wrap"><table><thead><tr><th>Trạng thái</th><th>New</th><th>Nguồn</th><th>Mã raw</th><th>Issue</th><th>Chi tiết</th><th>Ghi chú</th><th></th></tr></thead><tbody id="mismatches"></tbody></table></div></section></section>
</main><script src="/app.js"></script></body></html>
